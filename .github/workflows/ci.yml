name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet format --no-restore --verify-no-changes

      # ubuntu runners ship Docker, so Testcontainers-based integration tests (M2+) run here too
      - name: dotnet test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --no-build --configuration Release 2>&1 | tee test-output.txt

      # failing tests as annotations: readable from the checks API and the PR without opening the log
      - if: failure()
        shell: bash
        run: |
          awk '/^ *failed /{ if (block) print block; block=$0; n=8; next }
               n > 0 { block = block "%0A" $0; n--; next }
               END { if (block) print block }' test-output.txt |
            while IFS= read -r failure; do echo "::error title=Test failed::${failure}"; done

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # the screens against mocked APIs: the governance story, four-eyes and role rules, axe in both themes,
      # and visual baselines (e2e/__snapshots__)
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --reporter=github

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-screenshots
          path: |
            web/e2e/screenshots
            web/test-results
