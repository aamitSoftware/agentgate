<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e14" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored or system theme before first paint (no flash); ThemeProvider takes over after.
      (function () {
        var preference = "system";
        try { preference = localStorage.getItem("agentgate.theme") || "system"; } catch (error) {}
        var dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentGate Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
